services:
  mongo:
    image: mongo:7
    container_name: cuet-ai-campus-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cuet-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cuet-mongo-data:
